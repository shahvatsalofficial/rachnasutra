name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the static CLI image
        run: docker build -t rachnasutra:ci .
      - name: Image prints the version
        run: docker run --rm rachnasutra:ci version
