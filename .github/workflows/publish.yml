name: Publish

# Publishes package.json's version to npm. Does not run on every push to main.
# Requires a trusted publisher on npmjs.com for this file name: publish.yml
# Leave the npm environment field empty. This workflow does not set one.
# No NPM_TOKEN. npm CLI 11 uses GitHub's OIDC token.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'shahvatsalofficial/rachnasutra'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Use an npm CLI that supports trusted publishing
        run: npm install -g npm@11
      - name: Publish to npm
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package.json ${VERSION}."
              exit 1
            fi
          fi
          if npm view "rachnasutra@${VERSION}" version >/dev/null 2>&1; then
            echo "rachnasutra@${VERSION} is already on npm. Bump package.json before publishing."
            exit 1
          fi
          npm publish --access public
