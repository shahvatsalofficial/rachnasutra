name: Browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Broken page must produce a screenshot and axe findings
        run: |
          node dist/cli.js audit fixtures/intentionally-broken-ui --mode browser --format json --out rachnasutra-reports
          grep -q 'axe/' rachnasutra-reports/latest.json
          test -s rachnasutra-reports/screenshot.png
