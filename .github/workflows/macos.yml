name: macOS (non-blocking)

# Not a required check. A missing macOS runner must not fail the Linux and Windows CI workflow.
# macos-14 was retired on 2026-11-02, so that label is cancelled before any step runs.
# macos-latest is macOS 26 and often sits in the queue with no machine. macos-15 is the supported image.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify
