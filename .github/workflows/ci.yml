name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify
      - name: Good fixture must have no findings
        run: node dist/cli.js audit fixtures/good-ui --fail-on info
      - name: Broken fixture must fail the gate
        shell: bash
        run: |
          set +e
          node dist/cli.js audit fixtures/intentionally-broken-ui --fail-on high > /dev/null
          test $? -eq 1
      - name: Production dependencies must be empty
        run: npm ls --omit=dev --depth=0
