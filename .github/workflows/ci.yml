name: CI

# Required status checks on main must be exactly these eight jobs.
# macOS is not in CI. GitHub cancels queued macOS jobs after about 15 minutes
# with zero steps (run 42096695892). That red workflow was removed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify
      - name: Generated HTML docs match the Markdown
        run: npm run docs && git diff --exit-code -- documents/rachnasutra/html
      - name: Good fixture must have no findings
        run: node dist/cli.js audit fixtures/good-ui --no-report --fail-on info
      - name: Broken fixture must fail the gate
        shell: bash
        run: |
          set +e
          node dist/cli.js audit fixtures/intentionally-broken-ui --no-report --fail-on high > /dev/null
          test $? -eq 1
      - name: Production dependencies must be empty
        run: npm ls --omit=dev --depth=0
