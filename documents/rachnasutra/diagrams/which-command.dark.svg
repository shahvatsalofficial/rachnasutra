<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="t d">
<title id="t">Which command should I run?</title>
<desc id="d">A hub of ten goals, each pointing to the command that does it.</desc>
<style>
:root{--bg:#12100e;--card:#1b1815;--fg:#f2eee7;--muted:#bdb5a8;--line:#575045;--brand:#f0a070;--brand2:#3a2417;--blue:#8fc0f0;--blue2:#14283d;--green:#8fd6a8;--green2:#16301f;--amber:#f0d070;--amber2:#33290d;--red:#ff9a9a;--red2:#3b1717;--grid:#2c2822}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;fill:var(--fg)}
.h{font-size:22px;font-weight:700}.t{font-size:15px;font-weight:700}.s{font-size:12.5px;fill:var(--muted)}.m{font-family:ui-monospace,Consolas,"Liberation Mono",monospace;font-size:12.5px}
.n{font-size:12px;font-weight:700;fill:#fff}.ax{font-size:12px;fill:var(--muted)}.lbl{font-size:12px;font-weight:600;fill:var(--muted)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>
<rect width="1040" height="560" fill="var(--bg)"/>
<text x="24" y="36" class="h" text-anchor="start">Which command do I run?</text>
<text x="24" y="58" class="s" text-anchor="start">Start from what you want to do</text>
<rect x="410" y="84" width="220" height="64" rx="12" fill="var(--brand2)" stroke="var(--brand)" stroke-width="1.6"/>
<text x="520" y="121" class="t" text-anchor="middle">What do you want?</text>
<rect x="24" y="190" width="480" height="58" rx="12" fill="var(--brand2)" stroke="var(--brand)" stroke-width="1.6"/>
<text x="42" y="214" class="t" text-anchor="start">See all problems</text>
<text x="42" y="235" class="s m" text-anchor="start">rachnasutra audit .</text>
<rect x="536" y="190" width="480" height="58" rx="12" fill="var(--brand2)" stroke="var(--brand)" stroke-width="1.6"/>
<text x="554" y="214" class="t" text-anchor="start">Only accessibility</text>
<text x="554" y="235" class="s m" text-anchor="start">rachnasutra accessibility .</text>
<rect x="24" y="262" width="480" height="58" rx="12" fill="var(--green2)" stroke="var(--green)" stroke-width="1.6"/>
<text x="42" y="286" class="t" text-anchor="start">Block bad pull requests</text>
<text x="42" y="307" class="s m" text-anchor="start">rachnasutra ci .</text>
<rect x="536" y="262" width="480" height="58" rx="12" fill="var(--green2)" stroke="var(--green)" stroke-width="1.6"/>
<text x="554" y="286" class="t" text-anchor="start">Did my fix work?</text>
<text x="554" y="307" class="s m" text-anchor="start">rachnasutra verify --report &lt;json&gt; .</text>
<rect x="24" y="334" width="480" height="58" rx="12" fill="var(--blue2)" stroke="var(--blue)" stroke-width="1.6"/>
<text x="42" y="358" class="t" text-anchor="start">Plan the fixes</text>
<text x="42" y="379" class="s m" text-anchor="start">rachnasutra plan-fixes --report &lt;json&gt;</text>
<rect x="536" y="334" width="480" height="58" rx="12" fill="var(--blue2)" stroke="var(--blue)" stroke-width="1.6"/>
<text x="554" y="358" class="t" text-anchor="start">Inventory design tokens</text>
<text x="554" y="379" class="s m" text-anchor="start">rachnasutra design-system inspect .</text>
<rect x="24" y="406" width="480" height="58" rx="12" fill="var(--blue2)" stroke="var(--blue)" stroke-width="1.6"/>
<text x="42" y="430" class="t" text-anchor="start">Watch progress over time</text>
<text x="42" y="451" class="s m" text-anchor="start">rachnasutra history &lt;dir&gt;</text>
<rect x="536" y="406" width="480" height="58" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="1.6"/>
<text x="554" y="430" class="t" text-anchor="start">Check my setup</text>
<text x="554" y="451" class="s m" text-anchor="start">rachnasutra doctor</text>
<rect x="24" y="478" width="480" height="58" rx="12" fill="var(--amber2)" stroke="var(--amber)" stroke-width="1.6"/>
<text x="42" y="502" class="t" text-anchor="start">Use real browser + axe</text>
<text x="42" y="523" class="s m" text-anchor="start">rachnasutra audit --mode browser .</text>
<rect x="536" y="478" width="480" height="58" rx="12" fill="var(--amber2)" stroke="var(--amber)" stroke-width="1.6"/>
<text x="554" y="502" class="t" text-anchor="start">Teach my AI IDE</text>
<text x="554" y="523" class="s m" text-anchor="start">rachnasutra skills install --host claude</text>
<path d="M470 148 L470 166 L264 166 L264 190" fill="none" stroke="var(--muted)" stroke-width="1.8"  marker-end="url(#ah)"/>
<path d="M570 148 L570 166 L776 166 L776 190" fill="none" stroke="var(--muted)" stroke-width="1.8"  marker-end="url(#ah)"/>
</svg>
