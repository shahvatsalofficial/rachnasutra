<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 866" width="1040" height="866" role="img" aria-labelledby="t d">
<title id="t">RachnaSutra compared with axe-core on the same inputs</title>
<desc id="d">Precision and recall of RachnaSutra and axe-core on seven comparable ACT rules. axe-core is more accurate.</desc>
