<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-labelledby="t d">
<title id="t">CI gate decision</title>
<desc id="d">A pull request runs rachnasutra ci. Exit 0 lets the merge proceed; exit 1 blocks it; other codes report configuration or tool problems.</desc>
<style>
:root{--bg:#fbfaf7;--card:#ffffff;--fg:#1c1a17;--muted:#5b564f;--line:#bdb5a8;--brand:#8a3b12;--brand2:#f8e6da;--blue:#0b5cad;--blue2:#e4eefa;--green:#1d6b3f;--green2:#e2f3e9;--amber:#7a5200;--amber2:#fbf0d0;--red:#9a1f1f;--red2:#fbe4e4;--grid:#e7e2d8}
@media (prefers-color-scheme:dark){:root{--bg:#12100e;--card:#1b1815;--fg:#f2eee7;--muted:#bdb5a8;--line:#575045;--brand:#f0a070;--brand2:#3a2417;--blue:#8fc0f0;--blue2:#14283d;--green:#8fd6a8;--green2:#16301f;--amber:#f0d070;--amber2:#33290d;--red:#ff9a9a;--red2:#3b1717;--grid:#2c2822}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;fill:var(--fg)}
.h{font-size:22px;font-weight:700}.t{font-size:15px;font-weight:700}.s{font-size:12.5px;fill:var(--muted)}.m{font-family:ui-monospace,Consolas,"Liberation Mono",monospace;font-size:12.5px}
.n{font-size:12px;font-weight:700;fill:#fff}.ax{font-size:12px;fill:var(--muted)}.lbl{font-size:12px;font-weight:600;fill:var(--muted)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>
<rect width="1040" height="500" fill="var(--bg)"/>
<text x="24" y="36" class="h" text-anchor="start">The CI gate</text>
<text x="24" y="58" class="s" text-anchor="start">One command, stable exit codes, no flaky opinions</text>
<rect x="24" y="96" width="190" height="70" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="1.6"/>
<text x="119" y="126.5" class="t" text-anchor="middle">Pull request</text>
<text x="119" y="145.5" class="s" text-anchor="middle">opened or updated</text>
<rect x="264" y="96" width="280" height="70" rx="12" fill="var(--brand2)" stroke="var(--brand)" stroke-width="1.6"/>
<text x="404" y="126.5" class="t m" text-anchor="middle">npx rachnasutra ci .</text>
<text x="404" y="145.5" class="s m" text-anchor="middle">read-only, no network by default</text>
<path d="M214 131 L264 131" fill="none" stroke="var(--muted)" stroke-width="1.8"  marker-end="url(#ah)"/>
<polygon points="760,76 885,131 760,186 635,131" fill="var(--amber2)" stroke="var(--amber)" stroke-width="1.6"/>
<text x="760" y="135" class="t" text-anchor="middle">exit code?</text>
<path d="M544 131 L635 131" fill="none" stroke="var(--muted)" stroke-width="1.8"  marker-end="url(#ah)"/>
<rect x="120" y="214" width="70" height="36" rx="12" fill="var(--green2)" stroke="var(--green)" stroke-width="1.6"/>
<text x="155" y="237" class="t" text-anchor="middle">exit 0</text>
<text x="206" y="237" class="t" text-anchor="start">No confirmed high or critical</text>
<text x="560" y="237" class="s" text-anchor="start">Merge allowed</text>
<rect x="120" y="260" width="70" height="36" rx="12" fill="var(--red2)" stroke="var(--red)" stroke-width="1.6"/>
<text x="155" y="283" class="t" text-anchor="middle">exit 1</text>
<text x="206" y="283" class="t" text-anchor="start">Confirmed high / critical found</text>
<text x="560" y="283" class="s" text-anchor="start">Merge blocked, report uploaded</text>
<rect x="120" y="306" width="70" height="36" rx="12" fill="var(--amber2)" stroke="var(--amber)" stroke-width="1.6"/>
<text x="155" y="329" class="t" text-anchor="middle">exit 2</text>
<text x="206" y="329" class="t" text-anchor="start">Bad flag or config</text>
<text x="560" y="329" class="s" text-anchor="start">Fix rachnasutra.config.json</text>
<rect x="120" y="352" width="70" height="36" rx="12" fill="var(--amber2)" stroke="var(--amber)" stroke-width="1.6"/>
<text x="155" y="375" class="t" text-anchor="middle">exit 3</text>
<text x="206" y="375" class="t" text-anchor="start">Browser mode, no Playwright</text>
<text x="560" y="375" class="s" text-anchor="start">Install it or use static mode</text>
<rect x="120" y="398" width="70" height="36" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="1.6"/>
<text x="155" y="421" class="t" text-anchor="middle">exit 5</text>
<text x="206" y="421" class="t" text-anchor="start">Unexpected tool error</text>
<text x="560" y="421" class="s" text-anchor="start">Open an issue with --verbose</text>
<path d="M760 186 L760 205 L155 205 L155 214" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="24" y="482" class="s" text-anchor="start">Subjective visual opinions are never a gate. Only confirmed (deterministic) findings fail the build by default.</text>
</svg>
