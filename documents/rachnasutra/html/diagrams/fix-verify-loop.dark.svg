<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d">
<title id="t">The fix and verify loop</title>
<desc id="d">Save a baseline report, plan fixes, change the code, verify against the baseline, and repeat until nothing new is introduced.</desc>
<style>
:root{--bg:#12100e;--card:#1b1815;--fg:#f2eee7;--muted:#bdb5a8;--line:#575045;--brand:#f0a070;--brand2:#3a2417;--blue:#8fc0f0;--blue2:#14283d;--green:#8fd6a8;--green2:#16301f;--amber:#f0d070;--amber2:#33290d;--red:#ff9a9a;--red2:#3b1717;--grid:#2c2822}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;fill:var(--fg)}
.h{font-size:22px;font-weight:700}.t{font-size:15px;font-weight:700}.s{font-size:12.5px;fill:var(--muted)}.m{font-family:ui-monospace,Consolas,"Liberation Mono",monospace;font-size:12.5px}
.n{font-size:12px;font-weight:700;fill:#fff}.ax{font-size:12px;fill:var(--muted)}.lbl{font-size:12px;font-weight:600;fill:var(--muted)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>
<rect width="1040" height="470" fill="var(--bg)"/>
<text x="24" y="36" class="h" text-anchor="start">The fix and verify loop</text>
<text x="24" y="58" class="s" text-anchor="start">Proof that fixes worked and nothing new broke</text>
<rect x="24" y="100" width="200" height="90" rx="12" fill="var(--brand2)" stroke="var(--brand)" stroke-width="1.6"/>
<text x="124" y="131" class="t" text-anchor="middle">1. Baseline</text>
<text x="124" y="150" class="s" text-anchor="middle">rachnasutra audit .</text>
<text x="124" y="169" class="s" text-anchor="middle">saves latest.json</text>
<rect x="274" y="100" width="200" height="90" rx="12" fill="var(--blue2)" stroke="var(--blue)" stroke-width="1.6"/>
<text x="374" y="131" class="t" text-anchor="middle">2. Plan</text>
<text x="374" y="150" class="s" text-anchor="middle">plan-fixes --report</text>
<text x="374" y="169" class="s" text-anchor="middle">ordered, no edits</text>
<rect x="524" y="100" width="200" height="90" rx="12" fill="var(--amber2)" stroke="var(--amber)" stroke-width="1.6"/>
<text x="624" y="131" class="t" text-anchor="middle">3. Fix</text>
<text x="624" y="150" class="s" text-anchor="middle">small approved diffs</text>
<text x="624" y="169" class="s" text-anchor="middle">you or rachnasutra-canvas</text>
<rect x="774" y="100" width="242" height="90" rx="12" fill="var(--brand2)" stroke="var(--brand)" stroke-width="1.6"/>
<text x="895" y="131" class="t" text-anchor="middle">4. Verify</text>
<text x="895" y="150" class="s" text-anchor="middle">verify --report latest.json</text>
<text x="895" y="169" class="s" text-anchor="middle">compare by fingerprint</text>
<path d="M224 145 L274 145" fill="none" stroke="var(--muted)" stroke-width="1.8"  marker-end="url(#ah)"/>
<path d="M474 145 L524 145" fill="none" stroke="var(--muted)" stroke-width="1.8"  marker-end="url(#ah)"/>
<path d="M724 145 L774 145" fill="none" stroke="var(--muted)" stroke-width="1.8"  marker-end="url(#ah)"/>
<path d="M895 190 L895 235" fill="none" stroke="var(--muted)" stroke-width="1.8"  marker-end="url(#ah)"/>
<polygon points="895,235 1015,290 895,345 775,290" fill="var(--amber2)" stroke="var(--amber)" stroke-width="1.6"/>
<text x="895" y="285.5" class="t" text-anchor="middle">new findings</text>
<text x="895" y="302.5" class="t" text-anchor="middle">introduced?</text>
<path d="M775 290 L624 290 L624 190" fill="none" stroke="var(--muted)" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="700" y="280" class="lbl" text-anchor="middle">yes: exit 4, fix again</text>
<path d="M895 345 L895 385" fill="none" stroke="var(--muted)" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="912" y="370" class="lbl" text-anchor="middle">no</text>
<rect x="640" y="385" width="376" height="62" rx="12" fill="var(--green2)" stroke="var(--green)" stroke-width="1.6"/>
<text x="828" y="411.5" class="t" text-anchor="middle">Resolved and remaining are listed</text>
<text x="828" y="430.5" class="s" text-anchor="middle">now do the manual checks</text>
<text x="24" y="440" class="s" text-anchor="start">Static re-check only.</text>
<text x="24" y="458" class="s" text-anchor="start">Keyboard, screen reader and 200% zoom still need a person.</text>
</svg>
