<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 538" width="1040" height="538" role="img" aria-labelledby="t d">
<title id="t">Findings per audited public repository</title>
<desc id="d">Horizontal bars of finding counts for twelve public repositories.</desc>
<style>
